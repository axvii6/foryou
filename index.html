<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lego Date</title>

<style>
body {
  margin: 0;
  font-family: Poppins, sans-serif;
  background: #ffd6e8;
  overflow: hidden;
  height: 100vh;
}

.banner {
  position: absolute;
  top: 25%;
  left: 50%;
  transform: translateX(-50%);
  background: #ff9ac6;
  padding: 30px 50px;
  border-radius: 20px;
  color: white;
  text-align: center;
}

#yesBtn {
  position: absolute;
  top: 60%;
  left: 40%;
  padding: 12px 35px;
  border: none;
  border-radius: 25px;
  background: #ff9ac6;
  color: white;
  font-size: 1.1em;
  cursor: pointer;
}

#noBtn {
  position: absolute;
  top: 60%;
  left: 55%;
  padding: 12px 35px;
  border: none;
  border-radius: 25px;
  background: #ff9ac6;
  color: white;
  font-size: 1.1em;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="banner">
  <h1>Do you want to have a Lego date tomorrow? 💗</h1>
</div>

<button id="yesBtn">Yes ❤️</button>
<button id="noBtn">No 💔</button>

<script>
window.onload = function () {

  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");

  // ✔ Yes يفتح الصفحة
  yesBtn.onclick = function () {
    window.location.href = "love.html";
  };

  // ✔ No يهرب
  function moveNo() {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
  }

  noBtn.onmouseover = moveNo;
  noBtn.onclick = moveNo;

};
</script>

</body>
</html>
