<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lego date</title>

  <style>
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      overflow: hidden;
      background-color: #ffd6e8;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    #heartsContainer {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      bottom: -20px;
      width: 25px;
      height: 25px;
      background-color: #ff9ac6;
      transform: rotate(45deg);
      animation: float 6s linear forwards;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 25px;
      height: 25px;
      background-color: #ff9ac6;
      border-radius: 50%;
    }

    .heart::before { top: -12px; }
    .heart::after { left: -12px; }

    @keyframes float {
      100% {
        transform: translateY(-110vh) rotate(45deg);
        opacity: 0;
      }
    }

    .banner {
      position: absolute;
      top: 25%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(245,130,180,0.8);
      padding: 30px 60px;
      border-radius: 20px;
      text-align: center;
      color: white;
    }

    .buttons {
      position: absolute;
      top: 60%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 40px;
    }

    button {
      padding: 14px 40px;
      border-radius: 30px;
      border: none;
      background: #ff9ac6;
      color: white;
      font-size: 1.1em;
      cursor: pointer;
    }

    #noBtn {
      position: absolute;
    }
  </style>
</head>

<body>

  <div class="banner">
    <h1>Do you want to have a Lego date tomorrow?</h1>
  </div>

  <div class="buttons">
    <button id="yesBtn">Yes ❤️</button>
  </div>

  <button id="noBtn">No 💔</button>

  <div id="heartsContainer"></div>

  <script>
    const heartsContainer = document.getElementById('heartsContainer');
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');

    // 💗 قلوب
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.style.left = Math.random() * 100 + 'vw';
      heartsContainer.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }
    setInterval(createHeart, 150);

    // ✅ زر Yes
    yesBtn.addEventListener("click", () => {
      window.location.href = "/love";
    });

    // 🎯 مكان زر No بالبداية
    function setInitialPosition() {
      const yesRect = yesBtn.getBoundingClientRect();
      const left = yesRect.right + 20;
      const top = yesRect.top;

      noBtn.style.left = left + "px";
      noBtn.style.top = top + "px";
    }

    window.addEventListener("load", setInitialPosition);
    window.addEventListener("resize", setInitialPosition);

    // 😭 زر No يهرب
    function moveNoButton() {
      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;

      const newLeft = Math.random() * (window.innerWidth - btnWidth);
      const newTop = Math.random() * (window.innerHeight - btnHeight);

      noBtn.style.left = newLeft + "px";
      noBtn.style.top = newTop + "px";
    }

    noBtn.addEventListener('mouseenter', moveNoButton);
    noBtn.addEventListener('click', (e) => {
      e.preventDefault();
      moveNoButton();
    });
  </script>

</body>
</html>
