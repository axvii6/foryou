<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>my valentine</title>
  <style>
    /* basic setup */
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      overflow: hidden;
      background-color: #ffd6e8; 
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    /* floating hearts background */
    #heartsContainer {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }

    .heart {
      position: absolute;
      bottom: -20px;
      width: 25px;
      height: 25px;
      background-color: #ff9ac6;
      transform: rotate(45deg);
      animation: float 6s linear forwards;
      opacity: 0.9;
    }
    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 25px;
      height: 25px;
      background-color: #ff9ac6;
      border-radius: 50%;
    }
    .heart::before { top: -12px; left: 0; }
    .heart::after { left: -12px; top: 0; }

    @keyframes float {
      0% { transform: translateY(0) rotate(45deg) scale(0.8); opacity:0.9; }
      100% { transform: translateY(-110vh) rotate(45deg) scale(1.1); opacity:0; }
    }
    
    /* banner card */
    .banner {
      position: absolute;
      top: -150px; 
      left: 50%;
      transform: translateX(-50%);
      background-color: rgba(245, 130, 180, 0.8);
      border-radius: 20px;
      padding: 30px 60px;
      z-index: 3;
      text-align: center;
      transition: top 1s ease;
      overflow: visible;
    }

    .banner.slide-down {
      top: 25%;
    }

    #bubbles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
      z-index: 2;
    }

    .bubble {
      position: absolute;
      bottom: 0;
      width: 15px;
      height: 15px;
      background: rgba(255, 182, 193, 0.6);
      border-radius: 50%;
      animation: bubbleFloat 6s linear infinite;
      filter: drop-shadow(0 0 3px rgba(255, 182, 193, 0.8));
    }

    .bubble:nth-child(2) {
      width: 10px;
      height: 10px;
      animation-duration: 5s;
      left: 30%;
      animation-delay: 1.5s;
    }
    .bubble:nth-child(3) {
      width: 20px;
      height: 20px;
      animation-duration: 7s;
      left: 70%;
      animation-delay: 3s;
    }
    .bubble:nth-child(4) {
      width: 12px;
      height: 12px;
      animation-duration: 6.5s;
      left: 50%;
      animation-delay: 0.7s;
    }

    @keyframes bubbleFloat {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0.7;
      }
      100% {
        transform: translateY(-120px) scale(1.3);
        opacity: 0;
      }
    }

    .shine-text {
      position: relative;
      font-size: 2.8em;
      font-weight: 700;
      color: white;
      text-align: center;
      background: linear-gradient(90deg, white, #ffe6f1, white);
      background-size: 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shine 3s linear infinite, pulseGlow 3.5s ease-in-out infinite;
      z-index: 5;
    }

    @keyframes shine {
      to { background-position: 200%; }
    }

    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(1);
        text-shadow:
          0 0 8px rgba(255, 182, 193, 0.8),
          0 0 20px rgba(255, 182, 193, 0.5);
      }
      50% {
        transform: scale(1.07);
        text-shadow:
          0 0 15px rgba(255, 182, 193, 1),
          0 0 40px rgba(255, 182, 193, 0.7);
      }
    }

    .buttons {
      position: absolute;
      top: calc(40% + 140px);
      left: 45%;
      transform: translateX(-50%);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      z-index: 4;
      margin-top: 0;
      width: auto;
      height: auto;
    }

    #yesBtn {
      background-color: #ff9ac6;
      border: none;
      padding: 14px 40px;
      border-radius: 30px;
      color: white;
      font-size: 1.1em;
      cursor: pointer;
      transition: transform 0.2s;
      position: relative;
      user-select: none;
    }
    #yesBtn:hover {
      transform: scale(1.05);
    }

    #noBtn {
      position: absolute;
      background-color: #ff9ac6;
      color: #fbfafa;
      border: 2px solid #ff9ac6;
      padding: 14px 40px;
      border-radius: 30px;
      font-size: 1.1em;
      cursor: pointer;
      user-select: none;
      z-index: 5;
      transition: left 0.25s ease, top 0.25s ease;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="banner" id="banner">
      <h1 class="shine-text">Will you be my Valentine?</h1>
      <div id="bubbles">
        <div class="bubble" style="left: 20%; animation-delay: 0s;"></div>
        <div class="bubble" style="left: 40%; animation-delay: 1.5s;"></div>
        <div class="bubble" style="left: 60%; animation-delay: 3s;"></div>
        <div class="bubble" style="left: 80%; animation-delay: 0.7s;"></div>
      </div>
    </div>

    <div class="buttons" id="buttons">
      <button id="yesBtn">Yes ❤️</button>
    </div>

    <button id="noBtn">No 💔</button>

    <div id="heartsContainer"></div>
  </div>

  <script>
    const heartsContainer = document.getElementById('heartsContainer');
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    const banner = document.getElementById('banner');

    // Floating hearts
    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = 4 + Math.random() * 3 + 's';
      heartsContainer.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }
    setInterval(createHeart, 150);

    yesBtn.addEventListener("click", () => {
      window.location.href = "love.html";
    });

    // Banner slide down effect
    window.addEventListener('load', () => {
      setTimeout(() => {
        banner.classList.add('slide-down');
      }, 100);
    });

    // Position No button
    function positionNoButtonInitial() {
      const yesRect = yesBtn.getBoundingClientRect();

      const left = yesRect.right + 40;
      const top = yesRect.top;

      noBtn.style.left = `${left}px`;
      noBtn.style.top = `${top}px`;
    }

    window.addEventListener('load', () => {
      positionNoButtonInitial();
    });
    window.addEventListener('resize', () => {
      positionNoButtonInitial();
    });

    // Distance helper
    function distance(x1, y1, x2, y2) {
      return Math.sqrt((x2 - x1)**2 + (y2 - y1)**2);
    }

    // Move No button randomly
    function moveNoButton() {
      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;

      let newLeft, newTop;
      let tries = 0;

      const rect = noBtn.getBoundingClientRect();
      const currentLeft = rect.left;
      const currentTop = rect.top;

      const padding = 10;

      do {
        newLeft = Math.random() * (window.innerWidth - btnWidth - 2 * padding) + padding;
        newTop = Math.random() * (window.innerHeight - btnHeight - 2 * padding) + padding;
        tries++;
      } while (distance(newLeft, newTop, currentLeft, currentTop) < 150 && tries < 100);

      noBtn.style.left = `${newLeft}px`;
      noBtn.style.top = `${newTop}px`;
    }

    noBtn.addEventListener('mouseenter', moveNoButton);
    noBtn.addEventListener('click', (e) => {
      e.preventDefault();
      moveNoButton();
    });
  </script>
</body>
</html>
