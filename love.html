<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Valentine</title>
  <style>
    body.page2 {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ffd6e8 0%, #ff9ac6 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      position: relative;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    .message-card {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 25px;
      padding: 40px 50px;
      max-width: 400px;
      box-shadow: 0 8px 30px rgba(255, 154, 198, 0.6);
      backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 154, 198, 0.7);
      color: #fff9fb;
    }

    .message-card h1 {
      font-size: 2.8em;
      margin-bottom: 20px;
      text-shadow: 0 0 15px #ff69b4;
    }

    .message-card p {
      font-size: 1.2em;
      line-height: 1.6;
      font-weight: 600;
      text-shadow: 0 0 12px #ff9ac6;
      direction: rtl;
    }

    .btn {
      background-color: #ff9ac6;
      color: white;
      text-decoration: none;
      padding: 15px 45px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 1.1em;
      box-shadow: 0 6px 15px rgba(255, 154, 198, 0.8);
      display: inline-block;
      margin-top: 20px;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    #confetti-container {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
    }

    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      opacity: 0.9;
      animation: fall 6s linear infinite, sway 3s ease-in-out infinite;
      border-radius: 2px;
    }

    @keyframes fall {
      0% { transform: translateY(-10px) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(360deg); }
    }

    @keyframes sway {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(20px); }
    }
  </style>
</head>

<body class="page2">
  <div class="message-card">
    <h1> You said YES </h1>

    <p>
      اخييييرًا بنسوي الديت <br><br>

      أحبك و أحب وجودك بحياتي، الله يخليييك لي لياني <br><br>

      الوردة الصفراء -Arwa- 🌻
    </p>

    <a href="index.html" class="btn">I love you ❣️</a>
  </div>

  <div id="confetti-container"></div>

  <script>
    const colors = ['#ff4d6d', '#ff9ac6', '#ff66b3', '#ffc0cb', '#ffb6c1'];
    const container = document.getElementById('confetti-container');

    function createConfetti() {
      const c = document.createElement('div');
      c.classList.add('confetti');
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDuration = (Math.random() * 3 + 4) + 's';
      container.appendChild(c);

      setTimeout(() => c.remove(), 6000);
    }

    setInterval(createConfetti, 100);
  </script>
</body>
</html>
